<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DataPath Navigator</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            background: var(--gradient-card);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .auth-logo-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--gradient-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .auth-logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-logo-text {
            display: flex;
            flex-direction: column;
        }

        .auth-logo-text .main {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .auth-logo-text .sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--accent-yellow);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="stars-bg"></div>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <img src="photos/main-logo.png" alt="DataPath Navigator" onerror="this.style.display='none'; this.parentElement.innerHTML='🧭';">
                </div>
                <div class="auth-logo-text">
                    <span class="main">DataPath</span>
                    <span class="sub">NAVIGATOR</span>
                </div>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Start your AI-powered career journey</p>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Re-enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
